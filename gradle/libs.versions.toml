# https://docs.gradle.org/current/userguide/platforms.html#sec:sharing-catalogs

[versions]
androidGradlePlugin = "8.1.4"
kotlin = "2.1.0"
hilt = "2.53.1"
hiltExt = "1.2.0"
hiltCompiler = "2.53.1"
safeArgs = "2.8.5"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintLayout = "2.2.0"
navigation = "2.8.5"
recyclerview = "1.3.2"
legacy = "1.0.0"
activity = "1.9.3"
coroutines = "1.10.0"
lifecycleScope = "2.8.7"
lifecycleScope_extensions = "2.2.0"
gson = "2.10.1"
retrofit = "2.11.0"
okhttpLogging = "4.12.0"
glide = "4.13.2"
glide_transformations = "4.3.0"
markwon = "4.6.2"
timber = "5.0.1"
datastore = "1.1.1"
junit = "4.13.2"
extJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coreKtx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintLayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
legacy = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacy" }
activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }

navigationFragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigationUi = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

#Coroutines
coroutinesCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutinesAndroid = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

#lifecycle
lifecycleViewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleScope" }
lifecycleRuntime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleScope" }
lifecycleLivedata = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleScope" }
lifecycleExtensions = { group = "androidx.lifecycle", name = "lifecycle-extensions", version.ref = "lifecycleScope_extensions" }

#network and gson
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofitGson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttpLogging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }

#test libs
junit = { group = "junit", name = "junit", version.ref = "junit" }
extJUnit = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
espressoCore = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

#hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-ext-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltExt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hiltCompiler" }

#Glide
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide_compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
glide_transformations = { group = "jp.wasabeef", name = "glide-transformations", version.ref = "glide_transformations" }

datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
markwon_core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon_html = { group = "io.noties.markwon", name = "html", version.ref = "markwon" }
markwon_image = { group = "io.noties.markwon", name = "image", version.ref = "markwon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.1.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
safearges = { id = "androidx.navigation.safeargs.kotlin", version.ref = "safeArgs" }